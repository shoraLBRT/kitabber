# The same single command developers and sessions run locally: pwsh scripts/verify.ps1
# This file only prepares the machine (tools, caches) and publishes the results; the checks live in the script.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # E01-02: a run of the skeleton must stay under 20 minutes (raised from 10 in #375: the full check grew to 9-10 minutes).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'backend/**/*.csproj', 'backend/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            admin/pnpm-lock.yaml
      # Playwright's Chromium for the e2e steps of verify.ps1 (E01-16); the script installs the browser itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'admin/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # Chromium's system packages (#302): only those missing from the runner image, from cached .deb files, so a slow
      # Ubuntu mirror no longer costs minutes on every run. The key is the set of missing packages; see the script.
      - name: Plan Playwright system packages
        id: pw-deps
        run: scripts/ci/playwright-deps.sh plan
      - name: Restore Playwright system packages
        if: steps.pw-deps.outputs.missing == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-deps
          key: ${{ steps.pw-deps.outputs.key }}
      - name: Install Playwright system packages
        id: pw-deps-install
        if: steps.pw-deps.outputs.missing == 'true'
        run: scripts/ci/playwright-deps.sh install
      - name: Save Playwright system packages
        if: steps.pw-deps-install.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-deps
          key: ${{ steps.pw-deps.outputs.key }}
      # The secret scan of verify.ps1 needs gitleaks (E01-13); the archive is checked against the release checksums.
      # Renovate bumps the version through the custom manager in renovate.json (#285); the checksums file comes
      # from the same release, so the check keeps working after a bump.
      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.28.0
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
