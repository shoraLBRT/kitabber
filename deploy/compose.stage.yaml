# The stage stand (E01-03): the published images plus the infrastructure they use, behind Caddy.
# Deployed by scripts/deploy.ps1 (see docs/DEPLOY.md); every value comes from the env file written by the deploy
# (template: deploy/stage.env.example), a missing one stops compose. Nothing here holds a secret.
# Checked by scripts/deploy-test.ps1 (a step of scripts/verify.ps1 and of the images workflow).
name: ${STAGE_PROJECT:-kitabber-stage}

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    ASPNETCORE_ENVIRONMENT: Staging
    DOTNET_ENVIRONMENT: Staging
    ConnectionStrings__Platform: Host=postgres;Port=5432;Database=platform;Username=platform;Password=${POSTGRES_PASSWORD:?set in the env file}
    ConnectionStrings__RabbitMq: amqp://platform:${RABBITMQ_PASSWORD:?set in the env file}@rabbitmq:5672/
    ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?set in the env file}

services:
  # Runs before every new version of the API: scripts/deploy.ps1 calls `compose run --rm migrator migrate`.
  migrator:
    <<: *backend
    image: ${IMAGE_REGISTRY:?set in the env file}/migrator:${IMAGE_TAG:?set in the env file}
    restart: 'no'
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    image: ${IMAGE_REGISTRY:?set in the env file}/api:${IMAGE_TAG:?set in the env file}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # The aspnet image has no curl: a plain HTTP request over bash.
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 20

  workers:
    <<: *backend
    image: ${IMAGE_REGISTRY:?set in the env file}/workers:${IMAGE_TAG:?set in the env file}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  frontend:
    image: ${IMAGE_REGISTRY:?set in the env file}/frontend:${IMAGE_TAG:?set in the env file}
    restart: unless-stopped

  admin:
    image: ${IMAGE_REGISTRY:?set in the env file}/admin:${IMAGE_TAG:?set in the env file}
    restart: unless-stopped

  # The only published ports. Caddy gets TLS certificates for the addresses itself (Let's Encrypt).
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in the env file}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:?set in the env file}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - caddy:/data
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
      admin: { condition: service_healthy }

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the env file}
      POSTGRES_DB: platform
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U platform -d platform]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?set in the env file}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in the env file}
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, redis-cli ping | grep -q PONG]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:cd4009416f83d7e5895020cd71b0963f3b8a4dfc3de74bbb6fb3bfe5f81f01e0
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in the env file}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

configs:
  caddyfile:
    content: |
      {$$SITE_ADDRESS} {
        encode
        @api path /api/* /openapi/* /health
        reverse_proxy @api api:8080
        reverse_proxy frontend:3000
      }
      {$$ADMIN_ADDRESS} {
        encode
        reverse_proxy admin:8080
      }

volumes:
  postgres:
  redis:
  rabbitmq:
  caddy:
